name: bookly_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.1.0
  go_router: ^17.3.0
  equatable: ^2.1.0
  dartz: ^0.10.1
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: gt-sectra-fine
      fonts:
        - asset: assets/fonts/GT-Sectra-Fine-Regular.ttf
